[pytest]
# pytest configuration for QuAgent

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests

# Async test support
asyncio_mode = auto

# Coverage
# To run: pytest --cov=app tests/
